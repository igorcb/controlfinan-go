services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_go
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/controlfinan_go
      TEST_DATABASE_URL: postgres://app:app@db:5432/controlfinan_go_test
      SECRET_KEY_BASE: development-only-secret
      BCRYPT_COST: 12
    ports:
      - "8003:8000"
    volumes:
      - .:/app
      - go_cache:/home/app/go
      - go_build:/home/app/.cache/go-build
    depends_on:
      - db

volumes:
  db_data:
  go_cache:
  go_build:
