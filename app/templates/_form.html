{{define "form"}}{{$e := .Entry}}
<form class="card space-y-4" action="{{if $e.Persisted}}/current_accounts/{{$e.ID}}{{else}}/current_accounts{{end}}" accept-charset="UTF-8" method="post">{{if $e.Persisted}}<input type="hidden" name="_method" value="patch" autocomplete="off">{{end}}<input type="hidden" name="authenticity_token" value="{{.CSRF}}" autocomplete="off">
  {{template "errors" .Errors}}

  <div class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Tipo">
    <label class="flex cursor-pointer items-center justify-center rounded-md border border-slate-300 py-3 font-medium text-slate-600 has-checked:border-red-600 has-checked:bg-red-600 has-checked:text-white">
      <input class="sr-only" type="radio" value="debito"{{if eq $e.TypeLaunche -1}} checked="checked"{{end}} name="current_account[type_launche]" id="current_account_type_launche_debito"> Débito
    </label>
    <label class="flex cursor-pointer items-center justify-center rounded-md border border-slate-300 py-3 font-medium text-slate-600 has-checked:border-emerald-600 has-checked:bg-emerald-600 has-checked:text-white">
      <input class="sr-only" type="radio" value="credito"{{if eq $e.TypeLaunche 1}} checked="checked"{{end}} name="current_account[type_launche]" id="current_account_type_launche_credito"> Crédito
    </label>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label class="label" for="current_account_price">Valor</label>
      <input step="0.01" min="0.01" placeholder="0,00" inputmode="decimal"{{if not $e.Persisted}} autofocus="autofocus"{{end}} class="input text-lg font-semibold" type="number" value="{{$e.PriceField}}" name="current_account[price]" id="current_account_price">
    </div>

    <div>
      <label class="label" for="current_account_date_ocurrence">Data</label>
      <input class="input" type="date" value="{{$e.DateISO}}" name="current_account[date_ocurrence]" id="current_account_date_ocurrence">
    </div>

    <div>
      <label class="label" for="current_account_cost_id">Categoria</label>
      <select class="input" name="current_account[cost_id]" id="current_account_cost_id">{{if eq $e.CostID -1}}<option value="">Selecione</option>{{end}}
        {{range .Costs}}<option{{if eq .ID $e.CostID}} selected="selected"{{end}} value="{{.ID}}">{{.Name}}</option>{{end}}
      </select>
    </div>

    <div>
      <label class="label" for="current_account_cash_account_id">Conta</label>
      <select class="input" name="current_account[cash_account_id]" id="current_account_cash_account_id">{{if eq $e.CashAccountID -1}}<option value="">Selecione</option>{{end}}
        {{range .CashAccounts}}<option{{if eq .ID $e.CashAccountID}} selected="selected"{{end}} value="{{.ID}}">{{.Name}}</option>{{end}}
      </select>
    </div>

    <div class="sm:col-span-2">
      <label class="label" for="current_account_historic">Histórico</label>
      <input class="input" type="text" value="{{$e.HistoricText}}" name="current_account[historic]" id="current_account_historic">
    </div>
  </div>

  <div class="flex flex-col-reverse gap-3 sm:flex-row">
    <a class="btn-secondary py-3 sm:py-2" href="{{if $e.Persisted}}/current_accounts/{{$e.ID}}{{else}}/current_accounts{{end}}">Cancelar</a>
    <input type="submit" value="Salvar" class="btn-primary py-3 sm:order-first sm:py-2">
  </div>
</form>
{{end}}
